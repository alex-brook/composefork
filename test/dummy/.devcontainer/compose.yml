services:
  web:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/rails
      - bundle_data:/usr/local/bundle
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      RAILS_ENV: development
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      BIND: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - db

  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  bundle_data:
  postgres_data:
