name: "gem"

services:
  stash:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # A path in GEMSTASH_DATA makes this a bind mount, so CI can cache the gem
      # cache as a directory. Unset, it stays a named volume.
      - ${GEMSTASH_DATA:-data}:/gemstash
    networks:
      - net
    ports:
      - 127.0.0.1:9292:9292
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9292/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  data:

networks:
  net:
