name: "gem"

services:
  stash:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - data:/gemstash
    networks:
      - net
    ports:
      - 127.0.0.1:9292:9292
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9292/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  data:

networks:
  net:
