name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded push shouldn't leave a 20 minute integration run burning.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency breaks surface as a typecheck failure, so catching them here
  # keeps them off the two jobs that sit behind buildx. vet rather than build:
  # it typechecks _test.go too, and test/ is almost entirely test files.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # Vet never reads the tarballs, it only needs them to exist for the
      # //go:embed. Same trick as licenses.yml.
      - name: Stub the embedded image tarballs
        run: touch internal/system_amd64.tar internal/system_arm64.tar

      - name: Vet
        run: go vet ./...

  unit:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # gen.sh needs a docker-container builder to export image tarballs.
      - uses: docker/setup-buildx-action@v4

      # The embedded tarballs have to be real: TestSystemImageHasTag reads the
      # manifest out of them, and the round trip runs the image.
      - name: Build system images
        run: ./gen/gen.sh

      - name: Test
        run: go test ./internal/... -v

  integration:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: docker/setup-buildx-action@v4

      - name: Build system images
        run: ./gen/gen.sh

      # gemstash is a pull-through gem cache; persisting it across runs is what
      # stops every run re-fetching from rubygems.org. GEMSTASH_DATA turns its
      # volume into a bind mount so this directory is the cache.
      - uses: actions/cache@v6
        with:
          path: .cache/gemstash
          key: gemstash-${{ hashFiles('test/dummy/Gemfile.lock') }}
          restore-keys: gemstash-

      # TestMain brings gemstash up for the suite. The tests build the dummy
      # project and run real compose projects, so this is minutes, not seconds —
      # well past go test's 10m default.
      - name: Test
        env:
          GEMSTASH_DATA: ${{ github.workspace }}/.cache/gemstash
        run: go test ./test/ -v -timeout 40m
