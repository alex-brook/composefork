version: 2

before:
  hooks:
    - ./gen/gen.sh
    - ./gen/licenses.sh

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/alex-brook/composefork/cmd.version={{.Version}}
      - -X github.com/alex-brook/composefork/cmd.commit={{.Commit}}
      - -X github.com/alex-brook/composefork/cmd.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    # Listing files replaces goreleaser's defaults, so LICENSE/README are named
    # explicitly. third_party carries the dependency licenses, their NOTICE
    # files, and full source for the MPL-2.0 ones.
    files:
      - LICENSE
      - README.md
      - THIRD-PARTY.csv
      - third_party/**/*
